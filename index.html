<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>moshtroncity</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sixtyfour&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/tuicss@2.1.2/dist/tuicss.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Permission / loading overlay -->
  <div id="overlay" class="overlay">
    <div class="overlay-content">
      <h1 data-text="moshtroncity">moshtroncity</h1>
      <p id="error-msg" class="error-msg hidden"></p>
    </div>
  </div>

  <!-- Main canvas injected here by DatamoshLive -->
  <div id="canvas-container"></div>

  <!-- Controls panel -->
  <div id="controls" class="controls hidden">
    <fieldset class="tui-fieldset">
      <legend>&nbsp;moshtroncity&nbsp;</legend>

      <!-- Mode selector: shown when no mode is active -->
      <div id="mode-selector">
        <button class="tui-button mode-btn mode-btn-live purple-168 white-text" data-mode="live">Live</button>
        <button class="tui-button mode-btn mode-btn-play" data-mode="play">Play</button>
        <button class="tui-button mode-btn mode-btn-share orange-168 white-text" data-mode="share">Share</button>
      </div>

      <!-- Play mode -->
      <div id="mode-play" class="mode-content hidden">
        <button class="btn-back">&#8592; Back</button>
        <input type="file" id="file-input" accept="audio/*" hidden>
        <div class="play-layout">
          <button id="btn-open-file" class="tui-button play-open-btn">Open</button>
          <div class="play-player">
            <p id="play-track-name" class="play-track-name">No file selected</p>
            <div class="seek-wrap">
              <input type="range" id="seek-bar" min="0" max="1000" value="0" step="1" disabled>
            </div>
            <div class="time-display">
              <span id="time-current">--:--</span>
              <span id="time-total">--:--</span>
            </div>
            <div class="controls-row player-controls">
              <button id="btn-skip-back"    class="tui-button">&#x25C4;&#x25C4;</button>
              <button id="btn-play-pause"   class="tui-button" style="flex:1" disabled>&#x25BA; Play</button>
              <button id="btn-skip-forward" class="tui-button">&#x25BA;&#x25BA;</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Share mode -->
      <div id="mode-share" class="mode-content hidden">
        <button class="btn-back">&#8592; Back</button>
        <div class="share-panel">
          <a href="https://mrericsir.github.io/moshtroncity/" target="_blank" rel="noopener" class="share-url">mrericsir.github.io/moshtroncity</a>
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https%3A%2F%2Fmrericsir.github.io%2Fmoshtroncity%2F" alt="QR code" width="200" height="200" class="qr-code-img">
          <button id="btn-open-diagnose" class="btn-diagnose-link">diagnose</button>
        </div>
      </div>

      <!-- Diagnose mode -->
      <div id="mode-diagnose" class="mode-content hidden">
        <button class="btn-back">&#8592; Back</button>
        <div class="controls-row indicator-row">
          <span class="led" id="led-peak"></span>
          <span class="led-label">Peak</span>
          <span class="led" id="led-beat"></span>
          <span class="led-label">Beat</span>
          <span class="bpm-display">-- BPM</span>
        </div>
        <div class="controls-row">
          <button id="btn-diagnose-sync"  class="tui-button" style="flex:1">Sync</button>
          <button id="btn-diagnose-drop"  class="tui-button" style="flex:1">Drop</button>
          <button id="btn-diagnose-zoom"  class="tui-button" style="flex:1">Zoom</button>
          <button id="btn-color-flash"    class="tui-button" style="flex:1">Flash</button>
        </div>
      </div>

    </fieldset>
  </div>

  <!-- Semicircle toggle button -->
  <button id="btn-show-controls" class="btn btn-fab hidden" title="Open controls">&#9650;</button>

  <!-- Camera flip button (shown only on touch devices) -->
  <button id="btn-flip-camera" class="btn btn-flip-camera hidden" title="Flip camera">&#8635;</button>

  <script src="https://unpkg.com/datamoshlive@latest/dist/datamoshlive.js"></script>
  <script src="https://unpkg.com/tuicss@2.1.2/dist/tuicss.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
